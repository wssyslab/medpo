<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me.DPO</title>
  <link rel="stylesheet" href="css/index.css">    
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/common.js" defer></script>
  <script src="./js/index.js" defer></script>
  <script src="./js/dbgeneraldocshandler.js" defer></script>
  <script src="./js/dbpolicieshandler.js" defer></script>
  <!-- <script src="./js/dbawarenesshandler.js" defer></script> -->
  <script src="./js/dbvisionhandler.js" defer></script>
  <script src="./js/dbdatamappinghandler.js" defer></script>
  <script src="./js/dbgaphandler.js" defer></script>
  <script src="./js/dbprojectshandler.js" defer></script>
  <script src="./js/dbmeettingshandler.js" defer></script>
  <script src="./js/dbcontractmgmthandler.js" defer></script>
  <script src="./js/dbtrainingshandler.js" defer></script>
  <script src="./js/dbauditshandler.js" defer></script>
  <script src="./js/dbincidentshandler.js" defer></script>
  <script src="./js/dbcustomerscommhandler.js" defer></script>
  <script src="./js/dbholderscommhandler.js" defer></script>
  <script src="./js/dbanpdcommhandler.js" defer></script>
  
</head>
<body style="display: none;">
  <div class="layout">
    <!-- Topo -->
    <!-- <iframe id="header-frame" src="header.html"></iframe> -->
    <!-- usar data-src ao inves de src impede que o navegador carregue a página do iframe automaticamente. --> 
    <iframe id="header-frame" data-src="header.html"></iframe>

    <div class="main-area">
      <!-- Menu lateral -->
      <!-- <iframe id="menu-frame" src="menu.html"></iframe> -->
      <iframe id="menu-frame" data-src="menu.html"></iframe>

      <!-- Conteúdo principal -->
      <!-- <iframe id="content-frame" src="welcome.html"></iframe> -->
      <iframe id="content-frame" data-src="welcome.html"></iframe>
    </div>
  </div>  

  <!-- Gaveta flutuante exclusiva para celular -->
  <div id="mobile-menu-container" class="hidden">
    <iframe id="mobile-menu-frame" data-src="menu.html"></iframe>
  </div>

  <!-- Modal de Alteração de Senha -->
  <div id="modal-senha-container" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 20px; border-radius: 12px; width: 300px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
      <h3 style="margin-top: 0; color: #4E4552;">Alterar Senha</h3>

      <label style="display:block; font-size: 12px; margin-bottom: 4px;">Senha Atual:</label>
      <input type="password" id="senha-atual" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">

      <label style="display:block; font-size: 12px; margin-bottom: 4px;">Nova Senha:</label>
      <input type="password" id="nova-senha" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
      
      <label style="display:block; font-size: 12px; margin-bottom: 4px;">Confirme a Senha:</label>
      <input type="password" id="confirma-senha" style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
      
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="fecharModalSenha()" style="background: #eee; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">Cancelar</button>
        <button onclick="executarTrocaSenha()" style="background: #4E4552; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">Salvar</button>
      </div>
    </div>
  </div>

</body>
</html>
