<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/header.js" defer></script>
</head>
<body>
  <div style="display:flex; align-items:center; justify-content:space-between; height:60px; background:#441061; color:white; padding:0 1rem;">
    
    <!-- Ícone Home -->
    <img src="images/home.png" alt="Home" 
         onclick="parent.document.getElementById('content-frame').src='welcome.html'" 
         style="width:32px; height:32px; cursor:pointer; background:transparent;">

    <!-- Logo -->
    <img src="images/logomedpo.png" alt="Logo" style="width:80px; height:40px; object-fit:contain;">

    <!-- Usuário -->
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="text-align:right;">
        <div id="user-name">...</div>
        <div>
          <button onclick="parent.logout()" style="background:none; border:none; color:white; cursor:pointer;">Sair</button>
        </div>
      </div>
      <div id="user-avatar" style="width:40px; height:40px; border-radius:50%; background:white; color:#4E4552; display:flex; align-items:center; justify-content:center; font-weight:bold; overflow:hidden;">
        <!-- Aqui entra imagem ou iniciais -->
      </div>
    </div>
  </div>
</body>
</html>
