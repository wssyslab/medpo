<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meus Projetos</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #faf8fd;
    }
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      color: #441061;
      font-size: 20px;
    }
    .header button {
      background: #ffffff;
      color: #441061;
      border: 2px solid #441061;
      border-radius: 4px;
      width: 28px;
      height: 28px;
      font-size: 18px;
      cursor: pointer;      
      justify-content: center;
      align-items: center;   
      display: none; /* inicia os botoes invisiveis - ativa via JS se o usuario for admin */   
    } 
     
    .projects-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 20px;
      justify-items: center;
    }
    .project-card {
      background: white;
      border: 2px solid #441061;
      border-radius: 8px;
      width: 120px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
      overflow: hidden;
    }
    .project-card:hover {
      transform: scale(1.05);
    }
    .project-card h3 {
      margin: 0;
      padding: 6px;
      font-size: 14px;
      background: #441061;
      color: white;
    }
    .project-card img {
      width: 90px;
      height: 60px;
      object-fit: cover;
      margin: 10px auto;
      display: block;
      border-radius: 4px;
    }
  </style>
</head>
<body style="display: none;">

  <!-- Título e botão + -->
  <div class="header">
    <button onclick="parent.document.getElementById('content-frame').src='project.html?id=-1'" id="addBtn">+</button>
    <button onclick="parent.document.getElementById('content-frame').src='projectlist.html'" id="setVisibilityBtn">☰</button>
    <h2>Projetos</h2>
  </div>

  <div class="projects-container" id="projects"></div>

  <script src="./js/welcome.js">       

  </script>
</body>
</html>
