<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/index.css">
  <style>
    /* Remove margens do body e esconde barras de rolagem */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Esconde o scroll */
      background: transparent; /* Garante que não fique fundo branco sobrando */
    }    
    /* Remove a borda lateral que não faz sentido no modo popup */
    div[style*="border-right"] {
      border-right: none !important;
    }    
    /* Melhora os botões apenas quando estiverem dentro do popup do celular */
    nav#menu-items button {
      padding: 12px 16px !important; /* Mais área de toque */
      font-size: 16px !important; /* Letra um pouco maior */
      border-radius: 8px;
      transition: background 0.2s;
      width: 100%; /* Garante que o clique pegue em toda a linha */
    }
    
    nav#menu-items button:active {
      background-color: #f3ebf6 !important; /* Feedback visual ao clicar */
    }

    nav#menu-items img {
      width: 20px !important; /* Ícones levemente maiores */
      height: 20px !important;
    }
  </style>  
</head>
<body>
  <div style="background:#ffffff; color:#441061; height:100%; display:flex; flex-direction:column; border-right:1px solid #ccc;">
    <!-- Botão recolher -->
    <button id="expandMenuBtn" onclick="toggleMenu()" 
            style="background:#441061; color:white; border:none; padding:6px; cursor:pointer; display: none;">
      ☰
    </button>

    <!-- Navegação -->
    <nav id="menu-items" style="flex:1; display:flex; flex-direction:column; gap:10px; padding:10px;">
      <button onclick="parent.document.getElementById('content-frame').src='dashboard.html'" 
              style="background:none; border:none; color:#2F2933; cursor:pointer; text-align:left; display:flex; align-items:center; gap:6px;">
        <img src="images/dashboard.png" alt="Dashboard" style="width:16px; height:16px;">
        Dashboard
      </button>

      <button onclick="parent.document.getElementById('content-frame').src='adequacy.html'" 
              style="background:none; border:none; color:#2F2933; cursor:pointer; text-align:left; display:flex; align-items:center; gap:6px;">
        <img src="images/adequacao.png" alt="Adequação" style="width:16px; height:16px;">
        Adequação
      </button>      

      <button onclick="parent.document.getElementById('content-frame').src='routines.html'" 
              style="background:none; border:none; color:#2F2933; cursor:pointer; text-align:left; display:flex; align-items:center; gap:6px;">
        <img src="images/rotinas.png" alt="Rotinas" style="width:16px; height:16px;">
        Rotinas
      </button>            
      
      <button onclick="parent.document.getElementById('content-frame').src='project.html?id=' + parent.getCurrentProject()"
              style="background:none; border:none; color:#2F2933; cursor:pointer; text-align:left; display:none; align-items:center; gap:6px;"
              id="editProjectBtn">
        <img src="images/editar_projeto.png" alt="Editar projeto" style="width:16px; height:16px;">
        Editar projeto
      </button>            
    </nav>
  </div>

  <script  src="./js/menu.js"></script>
</body>
</html>
